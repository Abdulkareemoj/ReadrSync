# Desktop App CI/CD Configuration

name: Desktop App Pipeline

on:
    push:
        branches: [main, develop]
        paths: ["apps/desktop/**", "packages/**"]
        tags: ["desktop-v*"]
    pull_request:
        branches: [main, develop]
        paths: ["apps/desktop/**", "packages/**"]

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: "pnpm"
                  cache-dependency-path: pnpm-lock.yaml

            - name: Install Tauri Linux build deps
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev \
                    libappindicator3-dev librsvg2-dev patchelf

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Install dependencies (desktop + its workspace deps only)
              run: pnpm --filter "./apps/desktop..." install --frozen-lockfile

            - name: Lint
              run: pnpm turbo run lint --filter=desktop...

            - name: Type check
              run: pnpm turbo run typecheck --filter=desktop...

            - name: Build check (debug, Linux only — fast sanity check)
              working-directory: apps/desktop
              run: pnpm tauri build --debug

    # Only runs when you push a tag like "desktop-v1.0.0" — builds real
    # signed-or-not installers for all three OSes and attaches them to
    # a GitHub Release.
    release:
        needs: test
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: "macos-latest"
                      args: "--target aarch64-apple-darwin"
                    - platform: "macos-latest"
                      args: "--target x86_64-apple-darwin"
                    - platform: "ubuntu-latest"
                      args: ""
                    - platform: "windows-latest"
                      args: ""
        runs-on: ${{ matrix.platform }}
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: "pnpm"
                  cache-dependency-path: pnpm-lock.yaml

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

            - name: Install Tauri Linux build deps
              if: matrix.platform == 'ubuntu-latest'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev \
                    libappindicator3-dev librsvg2-dev patchelf

            - name: Install dependencies (desktop + its workspace deps only)
              run: pnpm --filter "./apps/desktop..." install --frozen-lockfile

            - name: Build and publish
              uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # Add TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD
                  # here once you set up updater signing — not required for a first release.
              with:
                  projectPath: apps/desktop
                  tagName: ${{ github.ref_name }}
                  releaseName: "Desktop ${{ github.ref_name }}"
                  releaseDraft: false
                  prerelease: true
                  args: ${{ matrix.args }}
